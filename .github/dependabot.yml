version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'org.fireflyframework:*'
    groups:
      spring-platform:
        patterns:
          - 'org.springframework*'
          - 'org.springdoc:*'
      jackson-compatibility:
        patterns:
          - 'com.fasterxml.jackson*'
      build-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
