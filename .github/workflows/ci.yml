name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      triggered-by:
        description: Orchestrator correlation identifier
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: jafly-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify full Jafly reactor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine Java verification requirements
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_changes.py --event "$CI_EVENT" --base "$CHANGE_BASE"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Test release tooling
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tests/release -v
      - name: Validate the complete reactor
        run: python3 scripts/release_tools.py check --output target/reactor-inventory.json
      - name: Check build tools and Docker
        if: steps.changes.outputs.java == 'true'
        run: |
          ./mvnw -version
          docker info
      - name: Compile, test, and install framework libraries
        if: steps.changes.outputs.java == 'true'
        run: ./mvnw -B -ntp -Dtest.serialization.protobuf=true -Dtest.serialization.avro=true clean install
      - name: Check generator and gRPC runtime alignment
        if: steps.changes.outputs.java == 'true'
        run: python3 scripts/verify_grpc_alignment.py --maven "$GITHUB_WORKSPACE/mvnw" --report target/grpc-alignment.json
      - name: Test all maintained standalone examples
        if: steps.changes.outputs.java == 'true'
        run: bash scripts/verify_examples.sh
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            target/grpc-alignment.json
          if-no-files-found: warn
          retention-days: 14
