name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - docs/site/**
  pull_request:
    paths-ignore:
      - '**/*.md'
      - docs/site/**
  workflow_dispatch:
    inputs:
      triggered-by:
        description: Orchestrator correlation identifier
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: jafly-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify full Jafly reactor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Test release tooling
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tests/release -v
      - name: Validate the complete reactor
        run: python3 scripts/release_tools.py check --output target/reactor-inventory.json
      - name: Check build tools and Docker
        run: |
          ./mvnw -version
          docker info
      - name: Compile, test, and install framework libraries
        run: ./mvnw -B -ntp clean install
      - name: Test the standalone onboarding application
        run: ./mvnw -B -ntp -f docs/examples/getting-started/pom.xml clean verify
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
