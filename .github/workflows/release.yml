name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable final-version tag to release
        required: true
        type: string
      triggered-by:
        description: Orchestrator correlation identifier
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: jafly-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    name: Verify and publish the unified train
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set isolated build and signing directories
        run: |
          echo "MAVEN_REPO=$RUNNER_TEMP/jafly-m2" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$RUNNER_TEMP/jafly-gpg" >> "$GITHUB_ENV"
      - name: Verify immutable tag and all project versions
        run: |
          python3 scripts/release_tools.py check --tag "$RELEASE_TAG" --remote origin --output "$RUNNER_TEMP/reactor-inventory.json"
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tests/release -v
          ./mvnw -version
          docker info
      - name: Verify publishing credentials are configured
        env:
          JAFLY_PACKAGES_TOKEN: ${{ secrets.JAFLY_PACKAGES_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for variable in JAFLY_PACKAGES_TOKEN SONATYPE_USERNAME SONATYPE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required publishing secret $variable is unavailable"
              exit 1
            fi
          done
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
      - name: Verify full reactor before deployment
        run: ./mvnw -B -ntp -Dmaven.repo.local="$MAVEN_REPO" clean install
      - name: Test all maintained standalone examples before publication
        run: bash scripts/verify_examples.sh -Dmaven.repo.local="$MAVEN_REPO"
      - name: Package and freeze the verified GitHub artifacts
        run: |
          ./mvnw -B -ntp -Dmaven.repo.local="$MAVEN_REPO" install -Prelease -DskipTests
          python3 scripts/github_packages.py plan --root . \
            --associations scripts/package-associations.jsonl \
            --repository "$MAVEN_REPO" --output "$RUNNER_TEMP/github-stage"
          mkdir -p target
          cp "$RUNNER_TEMP/github-stage/github-manifest.json" target/github-manifest.json
          cp "$RUNNER_TEMP/github-stage/package-homes.json" target/package-homes.json
      - name: Deploy the frozen files to the retained GitHub package homes
        env:
          JAFLY_PACKAGES_TOKEN: ${{ secrets.JAFLY_PACKAGES_TOKEN }}
          JAFLY_PACKAGES_USER: ${{ vars.JAFLY_PACKAGES_USER || github.actor }}
        run: |
          python3 scripts/release_tools.py check --tag "$RELEASE_TAG" --remote origin
          python3 scripts/github_packages.py execute --plan "$RUNNER_TEMP/github-stage" --maven ./mvnw
      - name: Verify every GitHub Packages artifact
        env:
          JAFLY_PACKAGES_TOKEN: ${{ secrets.JAFLY_PACKAGES_TOKEN }}
          JAFLY_PACKAGES_USER: ${{ vars.JAFLY_PACKAGES_USER || github.actor }}
        run: |
          python3 scripts/github_packages.py verify \
            --projects "$RUNNER_TEMP/github-stage/reactor-inventory.json" \
            --homes "$RUNNER_TEMP/github-stage/package-homes.json" \
            --manifest target/github-manifest.json \
            --output target/github-verification.json --attempts 12 --delay 10
      - name: Deploy and wait for Maven Central publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 scripts/release_tools.py check --tag "$RELEASE_TAG" --remote origin
          ./mvnw -B -ntp -s .github/maven-settings.xml \
            -Dmaven.repo.local="$MAVEN_REPO" deploy -Prelease,maven-central \
            -DautoPublish=true -DwaitUntil=published -DwaitMaxTime=3600 \
            -DoutputDirectory="$RUNNER_TEMP/central-bundle"
      - name: Verify every Maven Central artifact
        run: |
          python3 scripts/release_tools.py inventory \
            --bundle "$RUNNER_TEMP/central-bundle/central-bundle.zip" --output target/central-manifest.json
          python3 scripts/release_tools.py verify --manifest target/central-manifest.json \
            --url https://repo.maven.apache.org/maven2 --attempts 20 --delay 15
          cp target/central-manifest.json target/release-manifest.json
          cp "$RUNNER_TEMP/reactor-inventory.json" target/reactor-inventory.json
          git rev-parse HEAD > target/release-commit.txt
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_tools.py check --tag "$RELEASE_TAG" --remote origin
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::A release already exists; inspect its tag and assets rather than replacing it'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            target/release-manifest.json target/github-manifest.json \
            target/reactor-inventory.json target/release-commit.txt \
            target/package-homes.json target/github-verification.json
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --json url,tagName,isDraft,targetCommitish,assets
      - name: Retain release evidence even after a failed publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/*manifest.json
            target/reactor-inventory.json
            target/release-commit.txt
            target/package-homes.json
            target/github-verification.json
            ${{ runner.temp }}/reactor-inventory.json
            ${{ runner.temp }}/github-stage/*.json
            ${{ runner.temp }}/github-stage/*maven.log
            ${{ runner.temp }}/central-bundle/
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 90
