name: Check publishing configuration
on:
  workflow_dispatch:
    inputs:
      require-cross-repository-token:
        description: Require the configured Jafly Maven publishing token
        type: boolean
        default: true
      inspect-sonatype-deployments:
        description: Reconcile account-visible Sonatype staged GAVs using read-only GETs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  configuration:
    name: Inspect configured publishing credential names
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report configuration presence without exposing values
        env:
          JAFLY_PACKAGES_TOKEN: ${{ secrets.JAFLY_PACKAGES_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          REQUIRE_CROSS_REPOSITORY_TOKEN: ${{ inputs.require-cross-repository-token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ['SONATYPE_USERNAME', 'SONATYPE_PASSWORD',
                      'GPG_PRIVATE_KEY', 'GPG_PASSPHRASE']
          names = ['JAFLY_PACKAGES_TOKEN', *required]
          configured = {name: bool(os.environ.get(name)) for name in names}
          if os.environ['REQUIRE_CROSS_REPOSITORY_TOKEN'] == 'true':
              required.append('JAFLY_PACKAGES_TOKEN')
          missing = [name for name in required if not configured[name]]
          report = {'configured': configured, 'missing_required_names': missing,
                    'qualification': 'Presence only; no registry or signing authorization proved.'}
          Path('publishing-configuration.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if missing:
              raise SystemExit('Publishing configuration is incomplete.')
          PY
      - name: Retain configuration presence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publishing-configuration-${{ github.run_id }}
          path: publishing-configuration.json
          if-no-files-found: error
          retention-days: 14
      - name: Check out the exact workflow source for read-only Portal inventory
        if: inputs.inspect-sonatype-deployments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read account-visible Sonatype deployment coordinates
        if: inputs.inspect-sonatype-deployments
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: python3 -B scripts/sonatype_deployments.py --output sonatype-deployments.json
      - name: Retain the read-only Portal reconciliation report
        if: always() && inputs.inspect-sonatype-deployments
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonatype-deployments-${{ github.run_id }}
          path: sonatype-deployments.json
          if-no-files-found: error
          retention-days: 14
