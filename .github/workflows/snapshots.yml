name: Publish snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jafly-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate snapshot train
        run: |
          python3 scripts/release_tools.py check --snapshot
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tests/release -v
          ./mvnw -version
          docker info
      - name: Verify before deployment
        run: ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/jafly-m2" clean verify
      - name: Publish snapshot to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          ./mvnw -B -ntp -s .github/maven-settings.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/jafly-m2" deploy -Prelease \
            -DdeployAtEnd=true \
            -DaltDeploymentRepository="github::https://maven.pkg.github.com/$RELEASE_REPOSITORY"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
