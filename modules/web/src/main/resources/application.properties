# Firefly Common Web Library Configuration
# This library is designed for Spring WebFlux (reactive) applications only

# Explicitly exclude Spring MVC auto-configuration to prevent conflicts
spring.autoconfigure.exclude=\
  org.springframework.boot.webmvc.autoconfigure.WebMvcAutoConfiguration,\
  org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration,\
  org.springframework.boot.webmvc.autoconfigure.DispatcherServletAutoConfiguration,\
  org.springframework.boot.tomcat.autoconfigure.servlet.TomcatServletWebServerAutoConfiguration

# Ensure reactive web application type
spring.main.web-application-type=reactive


# Preserve the framework Jackson 2 HTTP serialization contract during migration.
spring.http.codecs.preferred-json-mapper=jackson2
