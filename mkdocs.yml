site_name: jafly
site_description: Build Java services with Jafly on Spring Boot. Learn the command path, choose modules, and configure providers.
site_author: Firefly Software Foundation
site_url: https://fireflyframework.github.io/fireflyframework-jafly/
repo_url: https://github.com/fireflyframework/fireflyframework-jafly
repo_name: fireflyframework-jafly
edit_uri: edit/main/docs/site/
docs_dir: docs/site
site_dir: site
strict: true
validation:
  links:
    anchors: warn
copyright: >-
  Framework code: Apache License 2.0. Firefly and jafly identities retain their own ownership.
theme:
  name: material
  language: en
  logo: assets/brand/jafly-wordmark-dark.svg
  favicon: assets/brand/framework-mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - stylesheets/jafly.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fireflyframework/fireflyframework-jafly
      name: Jafly source code
    - icon: material/web
      link: https://fireflyframework.org
      name: Framework by Firefly
